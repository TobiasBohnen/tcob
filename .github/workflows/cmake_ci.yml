name: CMake CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{matrix.config.os}}
    name:    ${{matrix.variant}} (${{matrix.config.name}}/${{matrix.build_type}}/${{matrix.config.os}})
    strategy:
      fail-fast: false
      matrix:
        variant: ['default', 'shared']
        build_type: ['Release', 'Debug']
        config:
          - name: 'MSVC'
            os:   'windows-2025'
            cc:   'cl'
            cxx:  'cl'
          - name: 'GCC-14'
            os:   'ubuntu-24.04'
            cc:   'gcc-14'
            cxx:  'g++-14'
            install_commands: 'sudo apt-get update; sudo apt-get install -y gcc-14 g++-14'
          - name: 'Clang-22'
            os:   'ubuntu-24.04'
            cc:   'clang-22'
            cxx:  'clang++-22'
            cxxflags: '-stdlib=libc++ -fexperimental-library'
            install_commands: 'wget https://apt.llvm.org/llvm.sh; chmod +x llvm.sh; sudo ./llvm.sh 22; sudo apt-get install -y libc++-22-dev libc++abi-22-dev'
        include:
          - variant:    'default'
            definition: '-DTCOB_BUILD_SHARED=OFF'
          - variant:    'shared'
            definition: '-DTCOB_BUILD_SHARED=ON'
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name:  Install compiler
      run:   ${{matrix.config.install_commands}}
      shell: bash
      if:    matrix.config.os == 'ubuntu-24.04'

    - name:  Install SDL3 deps
      run:   sudo apt-get update; sudo apt-get install -y build-essential git make pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
      shell: bash
      if:    matrix.config.os == 'ubuntu-24.04'
      
    - name:  Configure CMake
      run:   cmake -B ./build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DTCOB_IS_CI=ON ${{matrix.definition}}
      shell: bash
      env:
         CC:       ${{matrix.config.cc}}
         CXX:      ${{matrix.config.cxx}}
         CFLAGS:   ${{matrix.config.cflags}}
         CXXFLAGS: ${{matrix.config.cxxflags}}

    - name:  Build
      run:   cmake --build ./build --config ${{matrix.build_type}} -j 8
      shell: bash
      env:
         CC:       ${{matrix.config.cc}}
         CXX:      ${{matrix.config.cxx}}
         CFLAGS:   ${{matrix.config.cflags}}
         CXXFLAGS: ${{matrix.config.cxxflags}}
         
    - name: Test
      run:  ctest -C ${{matrix.build_type}} -j 8
      working-directory: ./build
      env:
         CTEST_OUTPUT_ON_FAILURE: 1



